name: Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Build, Test and Dockerize Backend
    runs-on: ubuntu-latest

    env:
      MYSQL_DATABASE: opsflow
      MYSQL_USER: opsflow_user
      MYSQL_PASSWORD: ci_test_password
      MYSQL_ROOT_PASSWORD: ci_root_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run backend tests
        run: ./mvnw clean test

      - name: Build Docker image
        run: docker build -t opsflow-backend:ci .

      - name: Start Docker Compose services
        run: docker compose up -d --build

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl --fail http://localhost:8080/api/operations; then
              echo "Backend is ready"
              exit 0
            fi

            echo "Waiting for backend..."
            sleep 5
          done

          echo "Backend failed to start"
          docker compose logs
          exit 1

      - name: Verify frontend
        run: |
          for i in {1..30}; do
            if curl --fail http://localhost:5173/; then
              echo "Frontend is ready"
              exit 0
            fi

            echo "Waiting for frontend..."
            sleep 5
          done

          echo "Frontend failed to start"
          docker compose logs frontend
          exit 1

      - name: Verify MySQL database
        run: |
          docker compose exec -T mysql \
            mysql -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" \
            -e "SHOW TABLES;"

      - name: Stop Docker Compose services
        if: always()
        run: docker compose down -v