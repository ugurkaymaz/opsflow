spring.application.name=opsflow-backend

# Active profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Database connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/opsflow}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:opsflow_user}
spring.datasource.password=${DB_PASSWORD}

# JWT configuration
app.jwt.secret=${JWT_SECRET}

# JPA common configuration
spring.jpa.open-in-view=false

# Security auto-configuration
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Default CORS configuration
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
