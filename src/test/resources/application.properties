
# H2 in-memory test database
spring.datasource.url=jdbc:h2:mem:opsflow_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate test configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Disable Flyway for H2-based tests
spring.flyway.enabled=false

# JWT configuration for automated tests
app.jwt.secret=opsflow-test-jwt-secret-key-for-automated-tests-only-2026
